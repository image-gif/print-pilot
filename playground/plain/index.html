<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test-print</title>
  <style>
    #box {
      border: 1px solid red;
      padding: 5px;
    }

    .row {
      display: flex;
    }

    .col {
      flex: 1;
    }

    .input {
      width: 100px;
    }
  </style>
</head>

<body>
  <section>
    <h3>html print case</h3>
    <div id="box">
      <form action="#" id="form">
        <section class="row">
          <section class="col">
            <label for="name">
              <span>Name: </span>
              <input type="text" id="name" name="name" class="input" />
            </label>
          </section>
          <section class="col">
            <label for="gender">
              <span>Gender: </span>
              <section id="gender">
                <div>
                  <input type="radio" id="male" name="gender" value="male" />
                  <label for="male">Male</label>
                </div>
                <div>
                  <input type="radio" id="female" name="gender" value="female" />
                  <label for="female">Female</label>
                </div>
              </section>
            </label>
          </section>
          <section class="col">
            <label for="age">
              <span>Age: </span>
              <input type="number" min="1" name="age" class="input" />
            </label>
          </section>
        </section>
      </form>
      <button id="print">Print Form</button>
    </div>
  </section>
  <section>
    <h3>image print case</h3>
    <div>
      <button id="print-image">print-image-link</button>
      <label for="print-image-file">
        <button >print-image-file</button>
        <input type="file" id="print-image-file" multiple style="visibility: hidden;">
      </label>
    </div>
  </section>
  <section>
    <h3>pdf print case</h3>
    <div>
      <button id="print-pdf">print-pdf-link</button>
      <input type="file" accept=".pdf" id="print-pdf-file" multiple>
    </div>
  </section>
  <script type="module" src="./index.js"></script>
</body>

</html>
